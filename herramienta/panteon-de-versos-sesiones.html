<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panteón de versos · Sesiones</title>
<style>
:root{
  --bg:#faf5ec; --surface:#ffffff; --surface2:#f4ede1; --ink:#2a2233; --muted:#6b6175; --line:#e4d9c8;
  --head:#2d1b3d; --head-ink:#fff7ea; --accent:#e8740c; --accent-ink:#ffffff; --accent2:#8a2f86;
  --ok:#2f7d4f; --ok-bg:#e3f3e8; --warn:#9a4a05; --warn-bg:#fdf0dc; --bad:#a82a1e; --bad-bg:#fbe5e2;
  --card-ink:#2a2233; --shadow:0 1px 2px rgba(40,20,50,.08),0 4px 14px rgba(40,20,50,.06);
  --c-titulo:#e4e1dc; --c-quien:#dccff0; --c-porquien:#f9d0e1; --c-hacia:#fbe8a0; --c-remate:#fbd6b4;
  --c-algo:#ffffff; --c-cierre:#d9f1d0; --c-paso:#cde2f7; --c-final:#fcc794; --c-rima:#a7dbaf;
  --c-dialogo:#bde7e4; --c-figura:#f5c0cd; --c-reto:#fde68a;
  --g2:#0f8b8d; --g3:#2f6fb3; --g4:#6b3fa0; --g5:#d4630b; --g6:#b0306f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16111b; --surface:#211a29; --surface2:#2a2233; --ink:#f2ecf6; --muted:#b8acc3; --line:#3b3148;
    --head:#100b15; --ok-bg:#183a26; --warn-bg:#3d2a10; --bad-bg:#3d1a17; --ok:#7fd3a0; --warn:#f3b46a; --bad:#f08a80;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16111b; --surface:#211a29; --surface2:#2a2233; --ink:#f2ecf6; --muted:#b8acc3; --line:#3b3148;
  --head:#100b15; --ok-bg:#183a26; --warn-bg:#3d2a10; --bad-bg:#3d1a17; --ok:#7fd3a0; --warn:#f3b46a; --bad:#f08a80;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
/* Encabezado */
header.top{background:var(--head);color:var(--head-ink);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:Georgia,serif;font-size:1.25rem;letter-spacing:.2px}
.brand span{font-size:.78rem;opacity:.8}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;color:var(--head-ink);font-size:.92rem}
nav.tabs button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.picado{height:10px;background:
  radial-gradient(circle at 10px -2px,transparent 7px,var(--accent) 7.5px) 0 0/20px 10px repeat-x}
main{padding:20px 0 60px}
.view{display:none}.view.on{display:block}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:.94rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gchip{color:#fff;border-radius:8px;padding:2px 9px;font-weight:700;font-size:.85rem;white-space:nowrap}
.g2{--gc:var(--g2)}.g3{--gc:var(--g3)}.g4{--gc:var(--g4)}.g5{--gc:var(--g5)}.g6{--gc:var(--g6)}
.gchip{background:var(--gc)}
/* Agenda */
.hero{display:grid;gap:16px;grid-template-columns:1.2fr 1fr;margin-bottom:22px}
.hero h1{font-size:1.7rem;margin-bottom:6px}
.today-list{display:grid;gap:10px;margin-top:12px}
.timeline{display:grid;gap:18px}
.day{display:grid;grid-template-columns:120px 1fr;gap:14px}
.day-h{padding-top:6px}
.day-h b{display:block;font-family:Georgia,serif;font-size:1.15rem;text-transform:capitalize}
.day-h small{color:var(--muted)}
.day.past .day-h b{color:var(--muted)}
.day.today .day-h b{color:var(--accent)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-top:4px}
.tag.today{background:var(--accent);color:#fff}
.tag.past{background:var(--surface2);color:var(--muted)}
.day-s{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.scard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gc);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.scard.done{opacity:.72}
.scard h3{font-size:1.02rem;font-family:inherit;font-weight:700}
.scard .meta{font-size:.85rem;color:var(--muted)}
.scard .row{margin-top:auto;padding-top:6px}
.done-mark{font-size:.8rem;color:var(--ok);font-weight:700}
/* Sesión */
.sess-head{border-left:8px solid var(--gc);display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;justify-content:space-between}
.sess-head h1{font-size:1.6rem}
.sess-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:18px}
.mom-rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.mom-rail button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:.86rem;text-align:left}
.mom-rail button[aria-current="true"]{background:var(--gc);border-color:var(--gc);color:#fff}
.mom-rail button small{display:block;opacity:.75;font-size:.74rem}
.mom h2{font-size:1.4rem;margin-bottom:4px}
.mom ul{margin:8px 0 0;padding-left:20px}
.mom li{margin:4px 0}
.box{border-radius:12px;padding:12px 14px;margin-top:14px}
.box.group{background:var(--surface2);border:1px dashed var(--line)}
.box.why{background:var(--warn-bg);color:var(--ink)}
.box h4{margin:0 0 6px;font-size:.8rem;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer .clock{font:700 2.2rem/1 ui-monospace,Menlo,Consolas,monospace;min-width:5.2ch}
.timer .clock.end{color:var(--bad)}
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1 1 140px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.side h3{font-size:1.05rem;margin-bottom:8px}
.side .card-box+.card-box{margin-top:14px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.94rem}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.tira{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;background:var(--c-reto);color:var(--card-ink);font-size:.92rem}
.ex{font-family:Georgia,serif;font-size:1.05rem}
.ex p{margin:2px 0}
.ex .dim{opacity:.45}
.exs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.exs .ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#proj .exs .ex{background:transparent;border-color:rgba(255,255,255,.2);font-size:clamp(.95rem,1.6vw,1.3rem)}
.ideas{display:block;font-size:.74rem;line-height:1.3;opacity:.75;font-style:italic;margin-top:2px}
.ideas-box{font-size:.8rem;color:var(--muted);margin-top:6px;font-style:italic}
.tc.extra::before{content:"＋";position:absolute;top:-7px;left:-6px;background:var(--accent2);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;width:15px;height:15px;display:flex;align-items:center;justify-content:center}
.legend-x{font-size:.78rem;color:var(--muted);margin-top:10px}
.legend-x b{display:inline-flex;width:15px;height:15px;border-radius:999px;background:var(--accent2);color:#fff;font-size:.62rem;align-items:center;justify-content:center}
/* Armador */
.arm-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap}
.gtabs button{border:2px solid var(--gc);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 14px;font-weight:700}
.gtabs button[aria-current="true"]{background:var(--gc);color:#fff}
.banner{background:var(--warn-bg);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.94rem}
.arm{display:grid;grid-template-columns:170px minmax(0,1fr) 380px;gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:86px}
.rail button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:.9rem}
.rail button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.rail button.inrange{background:var(--warn-bg)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:0 0 auto}
.dot.half{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.dot.full{background:var(--ok)}
.rail .cut{font-size:.74rem;color:var(--muted);border-top:2px dashed var(--line);padding-top:4px;margin-top:4px}
.step h2{font-size:1.3rem}
.step .q{color:var(--muted);margin:4px 0 12px}
.lbl{font-weight:700;font-size:.9rem;margin:14px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.tc{position:relative;border:1.5px solid rgba(0,0,0,.14);border-radius:9px;padding:8px 12px;min-height:44px;color:var(--card-ink);font-size:1rem;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.tc small.h{font-size:.78rem;opacity:.75}
.tc small.rc{font-size:.72rem;opacity:.7}
.tc[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.tc.fits::after{content:"✓ rima";position:absolute;top:-8px;right:-6px;background:var(--ok);color:#fff;font-size:.68rem;font-weight:700;border-radius:999px;padding:1px 6px}
.tc.algo{border-style:dashed}
.cat-titulo{background:var(--c-titulo)}.cat-quien{background:var(--c-quien)}.cat-porquien{background:var(--c-porquien)}
.cat-hacia{background:var(--c-hacia)}.cat-remate{background:var(--c-remate)}.cat-algo{background:var(--c-algo)}
.cat-cierre{background:var(--c-cierre)}.cat-paso{background:var(--c-paso)}.cat-final{background:var(--c-final)}
.cat-rima{background:var(--c-rima)}.cat-dialogo{background:var(--c-dialogo)}.cat-figura{background:var(--c-figura)}
.cat-reto{background:var(--c-reto)}
.algo-in{width:100%;border:2px dashed var(--accent);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1.05rem}
.preview{margin-top:16px;background:var(--surface2);border-radius:12px;padding:12px 14px;font-family:Georgia,serif;font-size:1.15rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:.95rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.aso{background:var(--warn-bg);color:var(--warn)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--surface2);color:var(--ink)}
.mini{display:inline-block;background:var(--c-titulo);color:var(--card-ink);border:1px solid rgba(0,0,0,.2);border-radius:6px;padding:0 8px;font-weight:700}
.nav2{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.cuad{position:sticky;top:86px;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.cuad h3{font-size:1.05rem;margin-bottom:2px}
.cuad .sub{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.strip{display:flex;flex-wrap:wrap;margin:6px 0;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 0 rgba(0,0,0,.05)}
.strip .seg{padding:5px 9px;color:var(--card-ink);font-size:.95rem}
.strip .num{background:var(--surface2);color:var(--muted);font-size:.72rem;font-weight:700;padding:6px 6px;display:flex;align-items:center}
.strip.empty{border:1.5px dashed var(--line);background:transparent;color:var(--muted);padding:5px 9px;font-size:.88rem}
.strip .syl{margin-left:auto;font-size:.72rem;padding:6px 8px;background:var(--surface2);color:var(--muted)}
.strip .syl.bad{color:var(--bad);font-weight:700}
.star{font-size:.82rem;color:var(--ok);margin:2px 0 8px;font-weight:600}
.cutline{border-top:2px dashed var(--muted);margin:10px 0 4px;padding-top:2px;font-size:.76rem;color:var(--muted)}
.qhead{font-family:Georgia,serif;font-weight:700;font-size:.9rem;margin-top:8px}
/* Guía */
.guide{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.guide h2{font-size:1.25rem;margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.2);vertical-align:middle}
.tablewrap{overflow-x:auto}
/* Proyección */
#proj{position:fixed;inset:0;background:#120c18;color:#fff7ea;z-index:100;display:none;flex-direction:column;padding:24px 32px}
#proj.on{display:flex}
#proj .ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:1rem;opacity:.85}
#proj .pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:1100px;margin:0 auto;width:100%}
#proj h2{font-size:clamp(2rem,5vw,3.6rem);color:#ffb35c}
#proj .pg{font-size:clamp(1.3rem,3vw,2.2rem);line-height:1.45}
#proj .pg ol,#proj .pg ul{margin:0;padding-left:1.2em}
#proj .pclock{font:700 clamp(3rem,9vw,7rem)/1 ui-monospace,Menlo,Consolas,monospace}
#proj .pclock.end{color:#ff7a6b}
#proj .pf{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#proj .btn{background:transparent;color:#fff7ea;border-color:rgba(255,255,255,.3);font-size:1.1rem}
#proj .btn.pri{background:var(--accent);border-color:var(--accent)}
.flash{animation:fl 1s ease 3}
@keyframes fl{50%{background:#5a1d1d}}
@media (max-width:1100px){
  .arm{grid-template-columns:150px minmax(0,1fr)}
  .cuad{grid-column:1/-1;position:static;max-height:none}
  .sess-grid{grid-template-columns:1fr}
}
@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .day{grid-template-columns:1fr;gap:6px}
  .arm{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto}
  .rail button{flex:0 0 auto}
  .rail .cut{border-top:0;border-left:2px dashed var(--line);padding:4px 6px;margin:0;white-space:nowrap}
  nav.tabs{margin-left:0}
}
@media print{
  header.top,.view:not(#v-arm),.arm-top,.banner,.rail,.step,#proj{display:none!important}
  body{background:#fff;color:#000}
  .arm{display:block}
  .cuad{position:static;max-height:none;box-shadow:none;border:0;background-image:none}
  .strip{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <b>Panteón de versos · Sesiones de octubre</b>
      <span>Biblioteca · Escuela Primaria «Molino de Rosas» · C.C.T. 09DPR1858N · Promotoría de Lectura · Ciclo 2026-2027</span>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <button data-act="nav" data-v="agenda">Agenda</button>
      <button data-act="nav" data-v="sess">Sesión</button>
      <button data-act="nav" data-v="arm">Armador</button>
      <button data-act="nav" data-v="guia">Guía</button>
    </nav>
  </div>
  <div class="picado"></div>
</header>

<main class="wrap">
  <section id="v-agenda" class="view"></section>
  <section id="v-sess" class="view"></section>
  <section id="v-arm" class="view"></section>
  <section id="v-guia" class="view"></section>
</main>

<div id="proj" role="dialog" aria-modal="true" aria-label="Modo proyección"></div>

<script>
/* =====================================================================
   1. DATOS · tomados de las hojas imprimibles por grado (2.° a 6.° A).
   Cada tarjeta final lleva tras «|» la pista que trae la hoja:
   2.° símbolo · 3.° símbolo y terminación · 4.° terminación · 5.° nada · 6.° sílabas.
   ===================================================================== */
const L = s => s.split(';').map(x => x.trim()).filter(Boolean);
const S = (a, b, ca, cb, ini, fin, extra) => Object.assign({ a, b, ca, cb, ini: L(ini), fin: L(fin) }, extra || {});
const A = (a, b, moldes, fin) => ({ a, b, ca: 'algo', cb: 'cierre', algo: true, ini: L(moldes), fin: L(fin) });

const TIRAS = [
  'Y colorín colorado, este cuento se ha acabado.',
  'Y aquí termina la historia de esta calaca sin memoria.',
  'Pon un pan en el altar y la Calaca vendrá a cenar.',
  'Que viva el Día de Muertos con los ojos bien abiertos.',
  'Si la Muerte vuelve a pasar, ¡que se quede a merendar!',
  'Y con esta me despido: ¡la Calaca se ha dormido!'
];

const G = {
  2: {
    name: '2.° A', N: 4, pairs: [[1, 2], [3, 4]], hint: 'sym', pista: true, stars: [2, 4], cut: null, quart: false, abcd: false,
    firma: 'Mis iniciales y 2.° A', lab: ['✂ Clase · mar 27'],
    sets: {
      orig: { titles: L('¡Ya llegó la Calaca!;La Calaca y mi familia;Una visita de huesos;La Calaca glotona;+La Dientona en mi casa;+¡Ahí viene la Huesuda!'), steps: [
      S('¿Quién llega?', '¿Por quién?', 'quien', 'porquien',
        'La Calaca llegó por;La Flaca llegó por;La Pelona llegó por;La Catrina llegó por;+La Huesuda llegó por;+La Calavera llegó por;+La Tilica llegó por;+La Dientona llegó por;+La Copetona llegó por;+La Chimuela llegó por',
        'mi mamá|☀;mi papá|☀;mi abuelita|☾;mi abuelito|✦;mi hermana|♥;mi hermano|◆;mi tía|♪;mi tío|⚑;el gato|♣;el ratón|★;mi mascota|●;mi vecina|✿;+mi abuela|■;+mi gatito|✦'),
      S('¿Qué hacía?', 'Rima', 'hacia', 'rima',
        'que estaba comiendo;que jugaba con;que dormía con;que bailaba con;que se escondió con;que cantaba con;que se reía con;que platicaba con;+que estaba regando;+que veía la tele con',

/* =====================================================================
   4. DETECTOR DE RIMA · núcleo silábico, sílaba tónica y comparación
   consonante (igual desde la vocal tónica) o asonante (mismas vocales).
   ===================================================================== */
const VOW = 'aeiouáéíóúü', STRONG = 'aeoáéó', ACC = 'áéíóú';
const deac = s => s.replace(/[áàä]/g, 'a').replace(/[éè]/g, 'e').replace(/[íì]/g, 'i').replace(/[óò]/g, 'o').replace(/[úùü]/g, 'u');
function lastWord(t) {
  const w = t.toLowerCase().replace(/[≈¡!¿?—«»,.;:"()]/g, ' ').trim().split(/\s+/);
  return w[w.length - 1] || '';
}
function nuclei(w) {
  const out = []; let prev = false;
  for (let i = 0; i < w.length; i++) {
    const c = w[i]; let isV = VOW.includes(c);
    if (c === 'u' && i > 0 && (w[i - 1] === 'q' || (w[i - 1] === 'g' && 'eiéí'.includes(w[i + 1] || '')))) isV = false;
    if (c === 'y' && i === w.length - 1 && i > 0 && VOW.includes(w[i - 1])) isV = true;
    if (!isV) { prev = false; continue; }
    if (prev) {
      const p = w[i - 1];
      const split = (STRONG.includes(p) && STRONG.includes(c)) || ('íú'.includes(c) && STRONG.includes(p)) || ('íú'.includes(p) && STRONG.includes(c));
      if (!split) { out[out.length - 1].e = i; continue; }
    }
    out.push({ s: i, e: i }); prev = true;
  }
  return out;
}
function rhymeOf(text) {
  const w = lastWord(text); const n = nuclei(w); if (!n.length) return null;
  let k = n.findIndex(x => { for (let i = x.s; i <= x.e; i++) if (ACC.includes(w[i])) return true; return false; });
  if (k < 0) k = ('aeiouns'.includes(w[w.length - 1]) && n.length > 1) ? n.length - 2 : n.length - 1;
  const x = n[k]; let pos = -1;
  for (let i = x.s; i <= x.e; i++) if (ACC.includes(w[i])) pos = i;
  if (pos < 0) { for (let i = x.s; i <= x.e; i++) if (STRONG.includes(w[i])) pos = i; if (pos < 0) pos = x.e; }
  const vs = [deac(w[pos])];
  for (let j = k + 1; j < n.length; j++) {
    const y = n[j]; let sp = -1;
    for (let i = y.s; i <= y.e; i++) if (STRONG.includes(w[i])) sp = i;
    vs.push(deac(w[sp < 0 ? y.e : sp]));
  }
  return { word: w, cons: deac(w.slice(pos)), aso: vs.join('-') };
}
function compareRhyme(a, b) {
  const r1 = rhymeOf(a), r2 = rhymeOf(b); if (!r1 || !r2) return { kind: 'no' };
  if (r1.word === r2.word) return { kind: 'same', r1, r2 };
  if (r1.cons === r2.cons) return { kind: 'cons', r1, r2 };
  if (r1.aso === r2.aso) return { kind: 'aso', r1, r2 };
  return { kind: 'no', r1, r2 };
}
const sylCount = t => t.toLowerCase().replace(/[^a-záéíóúüñy\s]/g, ' ').split(/\s+/).filter(Boolean).reduce((a, w) => a + Math.max(1, nuclei(w).length), 0);

  if (step.algo) {
    if (!v.m && !v.f && !v.txt) return null;
    const { pre, post } = molde(v.m || '____|,'); const txt = (v.txt || '').trim();
    const sp = pre.endsWith('«') ? '' : ' ';
    const cierre = v.f ? card(v.f).t : '____';
    const syl = (D.hint === 'syl' && v.m && txt && v.f) ? sylCount(pre + ' ' + txt) + (+card(v.f).h || 0) : null;
    return { done: !!(v.m && txt && v.f), segs: [[pre + sp + (txt || '✎ ____') + post, 'algo'], [cierre, D.steps[n - 1].cb]], text: pre + sp + (txt || '____') + post + ' ' + cierre, rhyme: v.f ? card(v.f).t : null, syl };
  }
  if (!v.i && !v.f) return null;
  let ini = v.i ? card(v.i).t : '____', fin = v.f ? clean(card(v.f).t) : '____';
  const contr = !!(v.contr && v.i && v.f && needsContr(ini, fin));
  if (contr) { ini = ini.replace(/(a|de)$/, m => m === 'a' ? 'al' : 'del'); fin = fin.replace(/^el\s+/, ''); }
  const syl = (D.hint === 'syl' && v.i && v.f) ? (+card(v.i).h || 0) + (+card(v.f).h || 0) - (contr ? 1 : 0) : null;
  return { done: !!(v.i && v.f), segs: [[ini, step.ca], [fin, step.cb]], text: ini + ' ' + fin, rhyme: v.f ? clean(card(v.f).t) : null, syl, contr };
}
function stepStatus(g, n) { const x = verse(g, n); return !x ? '' : (x.done ? 'full' : 'half'); }
function reached(g) { let k = 0; for (let n = 1; n <= G[g].N; n++) { if (verse(g, n) && verse(g, n).done) k = n; else break; } return k; }
function stepLab(D, n) { return D.cut && n >= D.cut ? D.lab[1] : D.lab[0]; }
function letter(D, n) { return D.abcd ? ' · ' + 'AABBCDCD'[n - 1] : ''; }

function exampleHTML(g, from) {
  const D = G[g];
  return '<div class="exs">' + D.exs.map(ex => {
    const lines = ex.v.map((v, i) => {
      const n = i + 1, t = v.length === 3 ? v[0] + (v[0].endsWith('«') ? '' : ' ') + v[1] + (v[0].endsWith('«') ? '»,' : ',') + ' ' + v[2] : v[0] + ' ' + v[1];
      return `<p class="${n < from ? 'dim' : ''}">${n}${letter(D, n)} · ${esc(t)}</p>`;

    return `<div class="ex"><p><b>«${esc(ex.t)}»</b></p>${lines}</div>`;

}

/* ---------- Temporizador ---------- */
const timer = { key: null, left: 0, total: 0, id: null };
function syncTimer(s, ms) {
  const key = s.id + ':' + ui.mom;
  if (timer.key !== key) { stopTimer(); timer.key = key; timer.total = ms[ui.mom].t * 60; timer.left = timer.total; }
  paintTimer();
}
function startTimer() {
  if (timer.id || timer.left <= 0) return;
  timer.id = setInterval(() => { timer.left--; if (timer.left <= 0) { timer.left = 0; stopTimer(); ring(); } paintTimer(); }, 1000);
  paintTimer();
}
function stopTimer() { if (timer.id) { clearInterval(timer.id); timer.id = null; } paintTimer(); }
function paintTimer() {
  const mm = String(Math.floor(timer.left / 60)).padStart(2, '0'), ss = String(timer.left % 60).padStart(2, '0');
  document.querySelectorAll('[data-clock]').forEach(e => { e.textContent = mm + ':' + ss; e.classList.toggle('end', timer.left === 0); });
  document.querySelectorAll('[data-bar]').forEach(e => e.style.width = (timer.total ? (100 * (timer.total - timer.left) / timer.total) : 0) + '%');
  document.querySelectorAll('[data-tbtn]').forEach(e => e.textContent = timer.id ? '❚❚ Pausar' : (timer.left === timer.total ? '▶ Iniciar' : '▶ Continuar'));
}
function ring() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 660; g.gain.setValueAtTime(.15, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d + .3); o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .32); });
  } catch (e) { }
  const p = document.getElementById('proj'); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash');
}

}

function feedbackHTML(g, n) {

  const out = [];
  const step = D.steps[n - 1], v = cala(g).v[n] || {};
  if (!step.algo && v.i && v.f && needsContr(card(v.i).t, clean(card(v.f).t))) {
    out.push(x.contr
      ? `<div class="fb info">Pegaste la tarjetita <span class="mini">${/de$/.test(card(v.i).t) ? 'del' : 'al'}</span> encima de «${/de$/.test(card(v.i).t) ? 'de el' : 'a el'}». <button class="btn sm" data-act="contr">Quitarla</button></div>`
      : `<div class="fb aso">Quedó «${/de$/.test(card(v.i).t) ? 'de el' : 'a el'}». En español se junta: <button class="btn sm" data-act="contr">Pegar la tarjetita «${/de$/.test(card(v.i).t) ? 'del' : 'al'}»</button></div>`);
  }
  const p = pairOf(D, n);
  if (p && x.rhyme) {
    const y = verse(g, p);
    if (y && y.rhyme) {
      const r = compareRhyme(x.rhyme, y.rhyme);
      const showEnd = pistaOn(g) || g <= 4;
      if (r.kind === 'cons') out.push(`<div class="fb ok">✓ Rima con el verso ${p}: «${esc(r.r1.word)}» y «${esc(r.r2.word)}» terminan en <b>-${esc(r.r1.cons)}</b>.</div>`);
      else if (r.kind === 'aso') out.push(`<div class="fb aso">≈ Suena parecido al verso ${p} (rima asonante: vocales ${esc(r.r1.aso)}). ${g <= 3 ? 'Con el mismo símbolo rimaría completo.' : '¡También se vale!'}</div>`);
      else if (r.kind === 'same') out.push(`<div class="fb aso">Es la misma palabra que en el verso ${p}. Prueba con otra tarjeta: la rima se luce más con palabras distintas.</div>`);
      else out.push(`<div class="fb no">Todavía no rima con el verso ${p} («${esc(r.r2 ? r.r2.word : y.rhyme)}»). ${showEnd && r.r2 ? 'Busca una tarjeta que termine en <b>-' + esc(r.r2.cons) + '</b>.' : 'Léelos juntos en voz alta: ¿suenan igual al final? Si lo necesitas, enciende «Pistas».'}</div>`);
    } else if (p > n) out.push(`<div class="fb info">Este verso rimará con el verso ${p}: ahí buscarás una tarjeta que suene como «${esc(x.rhyme)}».</div>`);
  }
  if (x.syl !== null && x.syl !== undefined) {
    const okS = x.syl >= 7 && x.syl <= 11;
    out.push(`<div class="fb ${okS ? 'ok' : 'no'}">${okS ? '✓' : '✗'} Este verso suma ≈ <b>${x.syl}</b> sílabas (palmadas)${step.algo ? ', contando tu Algo propio' : ''}. ${okS ? 'Está entre 7 y 11.' : x.syl > 11 ? 'Se pasa de 11: busca una combinación más corta.' : 'Le faltan: busca una combinación más larga.'}</div>`);
  }
  if (D.stars.includes(n) && reached(g) >= n) out.push(`<div class="fb ok">★ Al pegar este verso ya tienes una calaverita completa.</div>`);
  return out.join('');
}
function renderPreview() {
  const pv = document.getElementById('pv'); if (!pv) return; const n = +ui.step, x = verse(ui.g, n);
  pv.innerHTML = x ? `<div class="preview"><span>${esc(x.text)}</span><button class="btn sm" data-act="speak" data-t="${esc(x.text)}">🔊</button></div>${feedbackHTML(ui.g, n)}` : `<div class="preview muted" style="font-family:inherit;font-size:.95rem">Elige tus tarjetas: el verso aparecerá aquí.</div>`;
}

function renderCuad() {
  const g = ui.g, D = G[g], st = cala(g), el = document.getElementById('cuad'); if (!el) return;
  const rows = [];
  rows.push(st.title ? `<div class="strip" data-act="step" data-k="t"><span class="seg cat-titulo" style="font-weight:700">${esc(st.title)}</span></div>` : `<div class="strip empty" data-act="step" data-k="t">Título</div>`);
  for (let n = 1; n <= D.N; n++) {
    if (D.quart && n === 1) rows.push('<div class="qhead">Cuarteta 1</div>');
    if (D.cut && n === D.cut) rows.push(`<div class="cutline">${esc(D.lab[1])}: a partir de aquí</div>`);
    if (D.quart && n === 5) rows.push('<div class="qhead">Cuarteta 2</div>');
    const x = verse(g, n);
    if (!x) rows.push(`<div class="strip empty" data-act="step" data-k="${n}">Verso ${n}${letter(D, n)} · ${esc(D.steps[n - 1].a)}</div>`);
    else rows.push(`<div class="strip" data-act="step" data-k="${n}"><span class="num">${n}${D.abcd ? 'AABBCDCD'[n - 1] : ''}</span>${x.segs.map(s => `<span class="seg cat-${s[1]}">${esc(s[0])}</span>`).join('')}${x.syl ? `<span class="syl ${x.syl < 7 || x.syl > 11 ? 'bad' : ''}">${x.syl} síl.</span>` : ''}</div>`);
    if (D.stars.includes(n) && reached(g) >= n) rows.push(`<div class="star">★ Hasta aquí ya tienes una calaverita completa.${n === D.N ? ' ¡Felicidades!' : ''}</div>`);
  }
  if (st.reto) rows.push(`<div class="strip" data-act="step" data-k="r"><span class="num">★</span><span class="seg cat-reto">${esc(st.reto)}</span></div>`);
  if (st.firma) rows.push(`<p style="text-align:right;font-family:Georgia,serif;margin:10px 0 0">— ${esc(st.firma)}</p>`);
  el.innerHTML = `<h3>Mi calaverita literaria · ${D.name}</h3><div class="sub">Me quedé en el paso: <b>${reached(g) || '—'}</b> de ${D.N}</div>${rows.join('')}`;
}

function loadExample(g, k) {
  const D = G[g], ex = D.exs[k], st = blank(); st.title = ex.t;
  ex.v.forEach((v, i) => {
    const n = i + 1, step = D.steps[i];
    if (step.algo) st.v[n] = { m: step.ini.find(m => molde(m).pre === v[0]), txt: v[1], f: findCard(step.fin, v[2]) };
    else { const ini = findCard(step.ini, v[0]), fin = findCard(step.fin, v[1]); st.v[n] = { i: ini, f: fin, contr: !!(ini && fin && needsContr(card(ini).t, clean(card(fin).t))) }; }
  });
  calas[ckey(g)] = st; saveCala(g);
}

/* =====================================================================
   10. VISTA · GUÍA
   ===================================================================== */
function renderGuia() {
  document.getElementById('v-guia').innerHTML = `<div class="guide">
  <div class="card-box"><h2>La idea en pocas palabras</h2>
    <p>En primero, el alumno no redacta versos: los <b>arma</b>. Esta forma de trabajo lleva ese principio de 2.° a 6.° y sube la dificultad por cinco caminos: más versos, más piezas de la calaverita, más vocabulario, menos pistas de rima y esquemas de rima más exigentes, hasta combinar en sexto una cuarteta de rima pareada y otra de rima alterna.</p>
    <p>La calaverita de cada niño siempre rima y siempre está completa. El esfuerzo de escritura se concentra en <b>✎ Algo propio</b>: lo que solo él sabe de la persona a quien la dedica.</p></div>
  <div class="card-box"><h2>Cómo se arma un verso</h2>
    <p>Cada verso se forma con una tarjeta de <b>inicio</b> (la acción) y una <b>final</b> (la palabra que rima). Las tarjetas finales pertenecen a familias de rima; la regla es una sola: los dos versos de cada pareja usan la misma familia.</p>
    <p>Algo propio se escribe dentro de un molde ✎ y el verso se completa con una tarjeta de <b>cierre</b> que sí pertenece a una familia. Así lo que escribe el niño nunca rompe la rima.</p></div>
  <div class="card-box"><h2>Código de colores</h2><div class="tablewrap"><table><thead><tr><th></th><th>Pieza</th><th>Color</th></tr></thead><tbody>
    ${Object.entries(CAT).map(([k, v]) => `<tr><td><span class="sw cat-${k}"></span></td><td>${esc(v[0])}</td><td class="muted">${esc(v[1])}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:.85rem">Los colores de pantalla son aproximados a los de las hojas impresas.</p></div>
  <div class="card-box" style="grid-column:1/-1"><h2>Progresión de 2.° a 6.°</h2><div class="tablewrap"><table><thead><tr><th>Grado</th><th>Versos y rima</th><th>Pista de rima en la tarjeta</th><th>Reto principal</th><th>Sesiones</th></tr></thead><tbody>
    <tr><td>2.°</td><td>4 versos · AABB</td><td>Símbolo ★ ☾ ♥ + «rima con»</td><td>Dos pareados seguidos</td><td>vie 23 (Algo propio) · mar 27</td></tr>
    <tr><td>3.°</td><td>6 versos · AABBCC</td><td>Símbolo + terminación (★ -ón)</td><td>Historia con inicio, problema y final</td><td>jue 22 · mar 27</td></tr>
    <tr><td>4.°</td><td>8 versos · AABBCCDD</td><td>Solo terminación · ≈ asonante</td><td>Rimar sin símbolos; cosas y acciones</td><td>vie 23 · mié 28</td></tr>
    <tr><td>5.°</td><td>8 versos · 2 cuartetas AABB</td><td>Ninguna: se clasifica antes</td><td>Diálogo y rima reconocida de oído</td><td>vie 23 · mié 28</td></tr>
    <tr><td>6.°</td><td>8 versos · cuarteta pareada AABB + cuarteta alterna CDCD</td><td>Ninguna · sílabas en la tarjeta</td><td>Rima pareada y alterna, y ritmo</td><td>jue 22 · lun 26</td></tr>
  </tbody></table></div></div>
  <div class="card-box"><h2>El armador y sus pistas</h2>
    <p>El armador usa las mismas tarjetas de cada hoja. Comprueba la rima con un detector que compara la terminación desde la vocal tónica (rima consonante) o solo las vocales (asonante, «suena parecido»).</p>
    <p>El botón <b>Pistas</b> marca con «✓ rima» las tarjetas que encajan con su pareja. Viene encendido en 2.° a 4.° y apagado en 5.° y 6.°, como en las hojas; encenderlo es un ajuste DUA para quien lo necesite, no un atajo.</p></div>
  <div class="card-box"><h2>Dos versiones de las tarjetas de 2.° y 5.°</h2>
    <p><b>Hoja original</b>: las tarjetas del PDF «con tarjetas extra», que conserva el lenguaje de la hoja y llena los huecos de cada paso.</p>
    <p><b>Palabras de los niños</b>: las del PDF «palabras de los niños». En 5.° usan expresiones como <i>neta, bro, bien chido, qué oso, aguas, chill, random</i>; en 2.°, más cortas y sencillas: <i>¡qué onda!, súper, chido, ¡ups!, fresa, echar relajo</i>. Las tarjetas del ejemplo de la hoja 1 no cambian, para que siga sirviendo de guía.</p>
    <p>El botón en la sesión y en el armador cambia entre las dos. Cada versión guarda su propia calaverita. Las tarjetas <b>＋</b> son extras de pantalla que no vienen impresas.</p></div>
  <div class="card-box"><h2>Los nombres de la Muerte</h2>
    <p>En las calaveritas, la Muerte casi nunca se llama «la Muerte». Conocer sus apodos amplía el vocabulario y da más palabras para rimar. Las calaveritas modelo de cada grado usan nombres distintos.</p>
    <div class="tablewrap"><table><tbody>${NOMBRES.map(([n, d]) => `<tr><td><b>${esc(n)}</b></td><td>${esc(d)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card-box"><h2>Tarjetas extra ＋ e ideas de Algo propio</h2>
    <p>El armador trae más opciones que las hojas impresas en cada paso: nombres de la Muerte, personajes, acciones, cierres y finales. Se distinguen con el círculo <b>＋</b>. Cada tarjeta extra tiene al menos una pareja que rima en el verso que le corresponde.</p>
    <p>Bajo cada molde de Algo propio hay ideas en letra pequeña. No se pueden pegar: sirven para destrabar, no para copiar, porque el Algo propio es lo que solo el niño sabe de su persona.</p></div>
  <div class="card-box"><h2>Cuidados de convivencia</h2>
    <p>La calaverita es un juego con la muerte, no con las personas. Las tarjetas están pensadas para que el humor recaiga en la Muerte y no en el destinatario. Se dedican a familiares, mascotas, objetos u oficios, y no a compañeros del grupo, salvo en pareja y con acuerdo de ambos.</p>
    <p>En la revisión, «¿da risa sin burlarse?» es obligatoria en todos los grados.</p></div>
  <div class="card-box"><h2>Escuela, familia y especialistas</h2>
    <p>El Algo propio nace de la memoria familiar: la sesión del vie 23 propone pedir en casa una anécdota de la persona elegida. Si en el grupo hay niños con acompañamiento de USAER, los ajustes DUA de cada grado (dictado del Algo propio, pistas encendidas, hoja de margen A-B-C-D) pueden acordarse con el especialista antes de la sesión.</p></div>
  </div>`;
}

/* =====================================================================
   11. NAVEGACIÓN Y EVENTOS
   ===================================================================== */
function show(v) {
  ui.view = v;
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + v));
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.v === v));
  if (v === 'agenda') renderAgenda(); if (v === 'sess') renderSess(); if (v === 'arm') renderArm(); if (v === 'guia') renderGuia();
  window.scrollTo(0, 0);
}
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(t.replace(/[✎—«»]/g, ' ')); u.lang = 'es-MX'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { }
}
function openArmadorFromSess(s) {
  ui.g = s.g;
  if (s.from) { ui.range = { g: s.g, from: s.from, to: s.to, label: s.label + ' · ' + fmtDay(s.date) }; ui.step = s.from; }
  else { ui.range = null; ui.step = 't'; }
  closeProj(); show('arm');
}
function closeProj() { document.getElementById('proj').classList.remove('on'); }
function moveSess(d) {
  const i = SESS.findIndex(s => s.id === ui.sess), j = i + d;
  if (j >= 0 && j < SESS.length) { ui.sess = SESS[j].id; ui.mom = 0; renderSess(); window.scrollTo(0, 0); }
}
function setMom(i) {
  const s = curSess(); if (!s) return; const ms = moments(s);
  ui.mom = Math.max(0, Math.min(ms.length - 1, i)); renderSess();
  if (document.getElementById('proj').classList.contains('on')) renderProj();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, g = ui.g, st = cala(g);
  switch (a) {
    case 'nav': show(b.dataset.v); break;
    case 'open-sess': ui.sess = b.dataset.id; ui.mom = 0; show('sess'); break;
    case 'toggle-done': doneS[b.dataset.id] = !doneS[b.dataset.id]; store.set('pv-oct-done', doneS); show(ui.view); break;
    case 'sess-prev': moveSess(-1); break;
    case 'sess-next': moveSess(1); break;
    case 'mom': setMom(+b.dataset.i); break;
    case 'mom-prev': setMom(ui.mom - 1); break;
    case 'mom-next': setMom(ui.mom + 1); break;
    case 't-toggle': timer.id ? stopTimer() : startTimer(); break;
    case 't-reset': stopTimer(); timer.left = timer.total; paintTimer(); break;
    case 'proj-open': document.getElementById('proj').classList.add('on'); renderProj(); break;
    case 'proj-close': closeProj(); break;
    case 'm-example': { const s = curSess(); ui.exi[s.g] = +b.dataset.i; loadExample(s.g, +b.dataset.i); ui.g = s.g; ui.step = s.from || 1; ui.range = s.from ? { g: s.g, from: s.from, to: s.to, label: s.label + ' · ' + fmtDay(s.date) } : null; closeProj(); show('arm'); break; }
    case 'm-armador': openArmadorFromSess(curSess()); break;
    case 'grade': ui.g = +b.dataset.g; ui.step = (ui.range && ui.range.g === ui.g) ? ui.range.from : 't'; renderArm(); break;
    case 'step': case 'go': { const k = b.dataset.k; ui.step = /^\d+$/.test(k) ? +k : k; renderArm(); break; }
    case 'clear-range': ui.range = null; renderArm(); break;
    case 'pista': ui.pistas[g] = !pistaOn(g); renderArm(); break;
    case 'var': { const gg = +b.dataset.g; ui.vars[gg] = applyVar(gg, b.dataset.v); store.set('pv-oct-var' + gg, ui.vars[gg]); ui.exi[gg] = 0; show(ui.view); break; }
    case 'example': { const k = ui.exi[g] || 0, ex = G[g].exs[k]; if (confirm('¿Cargar «' + ex.t + '»? Se reemplaza la calaverita actual de ' + G[g].name + '.')) { loadExample(g, k); ui.exi[g] = (k + 1) % G[g].exs.length; renderArm(); } break; }
    case 'reset': if (confirm('¿Empezar una calaverita nueva de ' + G[g].name + '?')) { calas[ckey(g)] = blank(); saveCala(g); ui.step = (ui.range && ui.range.g === g) ? ui.range.from : 't'; renderArm(); } break;
    case 'pick': {
      const k = b.dataset.k, i = +b.dataset.i, D = G[g];
      if (k === 't') { const t = card(D.titles[i]).t; st.title = st.title === t ? null : t; }
      else if (k === 'r') st.reto = st.reto === TIRAS[i] ? null : TIRAS[i];
      else {
        const n = +ui.step, step = D.steps[n - 1], v = st.v[n] = st.v[n] || {};
        const val = (k === 'f' ? step.fin : step.ini)[i];
        v[k] = v[k] === val ? null : val;
        if (k !== 'm') { const ini = v.i ? card(v.i).t : '', fin = v.f ? clean(card(v.f).t) : ''; if (!(ini && fin && needsContr(ini, fin))) v.contr = false; }
        if (k === 'f' || k === 'i' || k === 'm') { const c = card(val).t; if (v[k]) speak(k === 'm' ? molde(val).pre : c); }
      }
      saveCala(g); renderArm(); break;
    }
    case 'contr': { const v = st.v[+ui.step]; v.contr = !v.contr; saveCala(g); renderPreview(); renderCuad(); break; }
    case 'check': st.checks[b.dataset.i] = b.checked; saveCala(g); break;
    case 'prep': { const p = store.get('pv-oct-prep', {}); p[b.dataset.k] = b.checked; store.set('pv-oct-prep', p); break; }
    case 'speak': speak(b.dataset.t); break;
    case 'speak-all': { const D = G[g]; const t = [st.title].concat([...Array(D.N)].map((_, i) => { const x = verse(g, i + 1); return x && x.done ? x.text : ''; })).concat([st.reto]).filter(Boolean).join('. '); speak(t || 'Todavía no hay versos.'); break; }
    case 'print': window.print(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'algoTxt') { const st = cala(ui.g), n = +ui.step; st.v[n] = st.v[n] || {}; st.v[n].txt = e.target.value; saveCala(ui.g); renderPreview(); renderCuad(); document.querySelectorAll('.rail .dot')[n].className = 'dot ' + stepStatus(ui.g, n); }
  if (e.target.id === 'firma') { cala(ui.g).firma = e.target.value; saveCala(ui.g); renderCuad(); }
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('proj').classList.contains('on')) return;
  if (e.key === 'Escape') closeProj();
  else if (e.key === 'ArrowRight') setMom(ui.mom + 1);
  else if (e.key === 'ArrowLeft') setMom(ui.mom - 1);
  else if (e.key === ' ') { e.preventDefault(); timer.id ? stopTimer() : startTimer(); }
});

/* Enlace directo desde el sitio de apuntes: #armador-6 abre el Armador de 6.°;
   también #agenda, #sesion y #guia. Sin enlace, abre la Agenda como siempre. */
(function () {
  const m = /^#(armador|agenda|sesion|guia)(?:-(\d))?$/.exec(location.hash || '');
  if (m && m[2] && G[+m[2]]) ui.g = +m[2];
  show(m ? { armador: 'arm', agenda: 'agenda', sesion: 'sess', guia: 'guia' }[m[1]] : 'agenda');
})();
</script>
